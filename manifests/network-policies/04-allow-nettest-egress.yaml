apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nettest-to-demo
  namespace: secure-app
spec:
  # Permit only labeled test Pods to connect to the demo app on TCP 8080.
  podSelector:
    matchLabels:
      role: nettest
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: demo
      ports:
        - protocol: TCP
          port: 8080
