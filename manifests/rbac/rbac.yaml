apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: secure-app
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: secure-app
rules:
  # Read-only access is limited to Pods in secure-app.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: secure-app
subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: secure-app
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
